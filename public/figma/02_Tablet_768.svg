<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 4400" width="768" height="4400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Syne:wght@700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .display-font { font-family: 'Syne', 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
      .mono-font { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="grad-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="grad-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="768" height="4400" fill="#07090E"/>

  <!-- Top Title -->
  <text x="32" y="32" class="mono-font" font-size="12" font-weight="700" fill="#A855F7">📟 TABLET VIEWPORT (768px) — IPAD &amp; TABLETS</text>

  <!-- Floating Tablet Navbar -->
  <g id="Tablet-Navbar" transform="translate(32, 50)">
    <rect width="704" height="68" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" filter="url(#shadow-card)"/>
    <circle cx="34" cy="34" r="18" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <text x="34" y="38" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">VM</text>
    <text x="64" y="38" font-size="15" font-weight="700" fill="#FFFFFF">Малеєв Віктор</text>
    <text x="64" y="52" font-size="10" fill="#94A3B8">Creative Producer &amp; Product Designer</text>

    <!-- Right Controls: Burger Menu -->
    <g transform="translate(648, 16)">
      <rect width="36" height="36" rx="10" fill="rgba(255,255,255,0.08)"/>
      <line x1="10" y1="13" x2="26" y2="13" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="10" y1="18" x2="26" y2="18" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="10" y1="23" x2="26" y2="23" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <!-- Hero Section -->
  <g id="Tablet-Hero" transform="translate(32, 150)">
    <rect width="704" height="420" rx="28" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
    
    <g transform="translate(40, 40)">
      <rect width="340" height="32" rx="16" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)"/>
      <circle cx="16" cy="16" r="4" fill="#10B981"/>
      <text x="30" y="20" font-size="11" font-weight="600" fill="#34D399">Відкритий до нових пропозицій • Remote</text>

      <text x="0" y="85" class="display-font" font-size="42" fill="#FFFFFF">Малеєв Віктор</text>
      <text x="0" y="125" font-size="18" font-weight="700" fill="#D946EF">Creative Producer &amp; Product Designer (GenAI)</text>
      
      <text x="0" y="160" font-size="14" fill="#94A3B8">Спеціалізуюся на продуктовому та UI/UX дизайні, створенні комерційного</text>
      <text x="0" y="182" font-size="14" fill="#94A3B8">AI-відео, моушені, а також саунд-дизайні та авторській музиці.</text>

      <!-- CTA Buttons Row -->
      <g transform="translate(0, 215)">
        <rect width="220" height="48" rx="14" fill="url(#grad-brand)"/>
        <text x="110" y="30" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Telegram: @diebbova ↗</text>
        
        <g transform="translate(235, 0)">
          <rect width="200" height="48" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
          <text x="100" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">CV / Резюме (PDF) 📄</text>
        </g>
      </g>

      <!-- 4 Stats in 1 Row -->
      <g transform="translate(0, 290)">
        <rect width="145" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
        <text x="14" y="24" class="display-font" font-size="15" fill="#EC4899">UI/UX &amp; AI</text>
        <text x="14" y="42" font-size="9" fill="#94A3B8">Дизайн &amp; ШІ</text>

        <g transform="translate(155, 0)">
          <rect width="145" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
          <text x="14" y="24" class="display-font" font-size="15" fill="#A855F7">10+ Tools</text>
          <text x="14" y="42" font-size="9" fill="#94A3B8">ШІ-інструментів</text>
        </g>

        <g transform="translate(310, 0)">
          <rect width="145" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
          <text x="14" y="24" class="display-font" font-size="15" fill="#38BDF8">Zero-to-One</text>
          <text x="14" y="42" font-size="9" fill="#94A3B8">Запуск з нуля</text>
        </g>

        <g transform="translate(465, 0)">
          <rect width="155" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
          <text x="14" y="24" class="display-font" font-size="15" fill="#F97316">Sound</text>
          <text x="14" y="42" font-size="9" fill="#94A3B8">FL Studio &amp; VST</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Redesign Why Not? Section (2-Col Tablet) -->
  <g id="Tablet-Redesign" transform="translate(32, 600)">
    <text x="0" y="24" class="mono-font" font-size="12" font-weight="700" fill="#A855F7">01 / CASE STUDY</text>
    <text x="0" y="55" class="display-font" font-size="28" fill="#FFFFFF">Редизайн платформи Why Not?</text>
    
    <g transform="translate(0, 80)">
      <!-- Left: Before Card -->
      <rect width="340" height="280" rx="20" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
      <rect x="16" y="16" width="308" height="180" rx="12" fill="#151924"/>
      <text x="170" y="110" font-size="13" fill="#64748B" text-anchor="middle">[До редизайну: яскраві градієнти]</text>
      <text x="20" y="225" font-size="14" font-weight="700" fill="#FFFFFF">Інтерфейс до оновлення</text>
      <text x="20" y="246" font-size="11" fill="#94A3B8">QR-коди та бульбашки відволікали від товарів</text>

      <!-- Right: After Card -->
      <g transform="translate(364, 0)">
        <rect width="340" height="280" rx="20" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
        <rect x="16" y="16" width="308" height="180" rx="12" fill="#151924"/>
        <text x="170" y="110" font-size="13" fill="#A855F7" text-anchor="middle">[Після редизайну: сучасний маркетплейс]</text>
        <text x="20" y="225" font-size="14" font-weight="700" fill="#FFFFFF">Нова вітрина маркетплейсу</text>
        <text x="20" y="246" font-size="11" fill="#94A3B8">Зростання конверсії та адаптивна дизайн-система</text>
      </g>
    </g>
  </g>

  <!-- Merch & Production (2-Col Tablet) -->
  <g id="Tablet-Merch" transform="translate(32, 1010)">
    <text x="0" y="24" class="mono-font" font-size="12" font-weight="700" fill="#EC4899">02 / MERCHANDISE</text>
    <text x="0" y="55" class="display-font" font-size="28" fill="#FFFFFF">Мерч та швейне виробництво</text>

    <g transform="translate(0, 80)">
      <rect width="340" height="240" rx="20" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
      <rect x="16" y="16" width="308" height="140" rx="12" fill="#151924"/>
      <text x="170" y="90" font-size="12" fill="#64748B" text-anchor="middle">[Lookbook Item 1]</text>
      <text x="20" y="185" font-size="14" font-weight="700" fill="#FFFFFF">Футболка Cyber Lily</text>
      <text x="20" y="206" font-size="11" fill="#94A3B8">Шовкодрук, преміум бавовна, вільний крій</text>

      <g transform="translate(364, 0)">
        <rect width="340" height="240" rx="20" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
        <rect x="16" y="16" width="308" height="140" rx="12" fill="#151924"/>
        <text x="170" y="90" font-size="12" fill="#64748B" text-anchor="middle">[Lookbook Item 2]</text>
