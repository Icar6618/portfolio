      <line x1="0" y1="0" x2="704" y2="0" stroke="rgba(255,255,255,0.1)"/>
      <text x="0" y="40" class="display-font" font-size="18" fill="#FFFFFF">Малеєв Віктор • 2026</text>
      <text x="0" y="62" font-size="12" fill="#64748B">Designed for Tablet (iPad 768px)</text>
    </g>
