    <text x="0" y="24" class="mono-font" font-size="12" font-weight="700" fill="#38BDF8">03 / BUSINESS &amp; EDUCATION</text>
    <text x="0" y="55" class="display-font" font-size="28" fill="#FFFFFF">Бізнес, Партнерства та Освіта</text>

    <g transform="translate(0, 80)">
      <rect width="704" height="280" rx="20" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
      <g transform="translate(32, 32)">
        <text x="0" y="20" class="display-font" font-size="18" fill="#FFFFFF">Zero-Investment Model &amp; MUZIKA.UA</text>
        <text x="0" y="46" font-size="13" fill="#94A3B8">Стратегічне партнерство з дистриб'ютором: реліз треку + випуск мерчу.</text>
        
        <!-- Academic Background Pills -->
        <g transform="translate(0, 75)">
          <text x="0" y="0" font-size="13" font-weight="700" fill="#FFFFFF">Академічна та професійна освіта:</text>
          <g transform="translate(0, 16)">
            <rect width="180" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
            <text x="90" y="19" font-size="11" fill="#CBD5E1" text-anchor="middle">ДФМХКК (Труба)</text>

            <g transform="translate(190, 0)">
              <rect width="190" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
              <text x="95" y="19" font-size="11" fill="#CBD5E1" text-anchor="middle">Диригування оркестром</text>
            </g>

            <g transform="translate(390, 0)">
              <rect width="180" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
              <text x="90" y="19" font-size="11" fill="#CBD5E1" text-anchor="middle">Alpaca School Design</text>
            </g>
          </g>
        </g>

        <!-- Secondary row -->
        <g transform="translate(0, 155)">
          <rect width="140" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text x="70" y="18" font-size="11" fill="#94A3B8" text-anchor="middle">Електрогітара</text>

          <g transform="translate(150, 0)">
            <rect width="140" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
            <text x="70" y="18" font-size="11" fill="#94A3B8" text-anchor="middle">Фортепіано</text>
          </g>

          <g transform="translate(300, 0)">
            <rect width="140" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
            <text x="70" y="18" font-size="11" fill="#94A3B8" text-anchor="middle">Флейта (3 кл.)</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Sound & Music Section (Tablet) -->
  <g id="Tablet-Sound" transform="translate(32, 1790)">
    <text x="0" y="24" class="mono-font" font-size="12" font-weight="700" fill="#F97316">04 / SOUND PRODUCTION</text>
    <text x="0" y="55" class="display-font" font-size="28" fill="#FFFFFF">Звук, Музика та SoundCloud</text>

    <!-- SoundCloud Card Full Width -->
    <g transform="translate(0, 80)">
      <rect width="704" height="240" rx="20" fill="#120A06" stroke="rgba(249,115,22,0.3)"/>
      <g transform="translate(32, 28)">
        <circle cx="6" cy="6" r="6" fill="#F97316"/>
        <text x="24" y="10" font-size="13" font-weight="700" fill="#F97316">SoundCloud Player Embed</text>
        <text x="640" y="10" class="mono-font" font-size="11" fill="#FB923C" text-anchor="end">@icar_music</text>

        <g transform="translate(0, 35)">
          <rect width="90" height="90" rx="14" fill="#1C1917"/>
          <text x="45" y="52" font-size="28" fill="#F97316" text-anchor="middle">♫</text>
          
          <g transform="translate(110, 15)">
            <text x="0" y="20" class="display-font" font-size="22" fill="#FFFFFF">Ікар — zaya</text>
            <text x="0" y="44" font-size="13" fill="#94A3B8">Оригінальний трек та саунд-дизайн у FL Studio з VST-плагінами</text>
            <text x="0" y="65" font-size="12" fill="#FB923C">Саундтреки для комерційних відео • Зведення • Мастеринг</text>
          </g>
        </g>

        <!-- CTA Link -->
        <g transform="translate(0, 150)">
          <rect width="640" height="42" rx="12" fill="#EA580C"/>
          <text x="320" y="26" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Слухати трек «zaya» на SoundCloud ↗</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Target Roles & Footer (Tablet) -->
  <g id="Tablet-Roles" transform="translate(32, 2160)">
    <text x="0" y="24" class="mono-font" font-size="12" font-weight="700" fill="#38BDF8">05 / CAREER ROLES</text>
    <text x="0" y="55" class="display-font" font-size="28" fill="#FFFFFF">Цільові ролі &amp; Компетенції</text>

    <!-- 2x2 Roles Grid -->
    <g transform="translate(0, 80)">
      <rect width="340" height="130" rx="16" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
      <text x="20" y="36" font-size="14" font-weight="700" fill="#FFFFFF">1. AI Creative Producer</text>
      <text x="20" y="58" font-size="11" fill="#94A3B8">GenAI відео, Runway Gen-3, моушен,</text>
      <text x="20" y="76" font-size="11" fill="#94A3B8">арт-дирекшн комерційних проєктів.</text>

      <g transform="translate(364, 0)">
        <rect width="340" height="130" rx="16" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
        <text x="20" y="36" font-size="14" font-weight="700" fill="#FFFFFF">2. Product Designer (UI/UX)</text>
        <text x="20" y="58" font-size="11" fill="#94A3B8">Figma дизайн-системи, e-commerce,</text>
        <text x="20" y="76" font-size="11" fill="#94A3B8">адаптивний UX, Alpaca School.</text>
      </g>

      <g transform="translate(0, 150)">
        <rect width="340" height="130" rx="16" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
        <text x="20" y="36" font-size="14" font-weight="700" fill="#FFFFFF">3. Sound Designer &amp; Producer</text>
        <text x="20" y="58" font-size="11" fill="#94A3B8">FL Studio, VST-плагіни, авторські</text>
        <text x="20" y="76" font-size="11" fill="#94A3B8">треки, диригування, труба (ДФМХКК).</text>
      </g>

      <g transform="translate(364, 150)">
        <rect width="340" height="130" rx="16" fill="rgba(255,255,255,0.02)" stroke="url(#grad-stroke)"/>
        <text x="20" y="36" font-size="14" font-weight="700" fill="#FFFFFF">4. Brand &amp; Merch Director</text>
        <text x="20" y="58" font-size="11" fill="#94A3B8">Швейне виробництво в Україні,</text>
        <text x="20" y="76" font-size="11" fill="#94A3B8">B2B-партнерства, лідерство (Why Not?).</text>
